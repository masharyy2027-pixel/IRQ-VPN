
name: Build FREE IQ VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract new project
        run: unzip -o FREE-IQ-VPN-source.zip -d .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android files
        run: flutter create . --platforms=android --project-name=free_iq_vpn

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FREE-IQ-VPN-APK
          path: build/app/outputs/flutter-apk/app-release.apk
